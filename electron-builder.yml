# Packaging config for electron-builder (Windows targets).
# Run `npm run package:win` — it builds into out/ first, then writes installers
# to release/. See docs/DEVELOPMENT.md.
appId: by.beide.ide
productName: beide
copyright: Copyright © 2026 beide

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  # Renderer dependencies are already bundled into out/renderer by Vite, so
  # their sources are dead weight (~245 MB). Only drop packages `electron/` can
  # never reach: a blanket "!node_modules/**" + whitelist also strips the pi
  # SDK's hoisted dependencies and the app then starts without a window.
  - "!node_modules/monaco-editor/**"
  - "!node_modules/@monaco-editor/**"
  - "!node_modules/@tabler/**"
  - "!node_modules/lucide-react/**"

asar: true
# pi resolves paths inside its own package at runtime and spawns helpers, so it
# has to sit on the real filesystem instead of inside the asar archive.
# @lydell/node-pty loads a native .node binary + conpty helper the same way.
asarUnpack:
  - node_modules/@earendil-works/**
  - node_modules/@lydell/**

# Auto-update feed (electron-updater, generic provider). The URL must serve
# latest.yml + the artifacts from `npm run package:win` — upload them there on
# every release (electron-builder --publish also can). Placeholder until real
# hosting exists; the updater fails silently when the feed is unreachable.
publish:
  provider: generic
  url: https://beide.by/updates

win:
  icon: build/icon.ico
  executableName: beide
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: beide
  uninstallDisplayName: beide ${version}
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
