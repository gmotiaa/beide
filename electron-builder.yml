# Packaging config for electron-builder (Windows + macOS targets).
# Windows: `npm run package:win` locally or CI. macOS: dmg/zip can only be
# built on a macOS host — .github/workflows/release.yml runs a macos-latest
# job for that. See docs/DEVELOPMENT.md.
appId: by.beide.ide
productName: beide
copyright: Copyright © 2026 beide

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  # Renderer dependencies are already bundled into out/renderer by Vite, so
  # their sources are dead weight (~245 MB). Only drop packages `electron/` can
  # never reach: a blanket "!node_modules/**" + whitelist also strips the pi
  # SDK's hoisted dependencies and the app then starts without a window.
  - "!node_modules/monaco-editor/**"
  - "!node_modules/@monaco-editor/**"
  - "!node_modules/@tabler/**"
  - "!node_modules/lucide-react/**"
  # More renderer-only packages Vite already bundled into out/renderer.
  # Dropping them shrinks app.asar → less I/O on cold start and a smaller
  # installer. The pi SDK depends on none of these (verified via its deps).
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/scheduler/**"
  - "!node_modules/@base-ui/**"
  - "!node_modules/@pierre/**"
  - "!node_modules/@streamdown/**"
  - "!node_modules/@supabase/**"
  - "!node_modules/i18next/**"
  - "!node_modules/react-i18next/**"
  - "!node_modules/zustand/**"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.md"

asar: true
# pi resolves paths inside its own package at runtime and spawns helpers, so it
# has to sit on the real filesystem instead of inside the asar archive.
# @lydell/node-pty loads a native .node binary + conpty helper the same way.
asarUnpack:
  - node_modules/@earendil-works/**
  - node_modules/@lydell/**

# Auto-update feed: GitHub Releases of gmotiaa/beide. electron-updater reads
# latest.yml from the newest release; .github/workflows/release.yml uploads it
# (and the installers) on every v* tag. Public repo → no token needed to check.
publish:
  provider: github
  owner: gmotiaa
  repo: beide

win:
  icon: build/icon.ico
  executableName: beide
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# macOS: unsigned build (no Apple Developer cert yet) — Gatekeeper shows the
# right-click-to-open prompt. electron-builder converts build/icon.png
# (1024×1024) into the .icns automatically. zip is required alongside dmg for
# electron-updater on macOS.
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: beide
  uninstallDisplayName: beide ${version}
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
