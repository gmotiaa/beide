name: Release

# Tag a version to ship it:
#   npm version patch   (bumps package.json + creates the vX.Y.Z tag)
#   git push origin main --tags
# Each OS job builds its own installers and electron-builder uploads them
# (plus latest.yml / latest-mac.yml) to the same GitHub Release;
# electron-updater in the packaged app picks updates up from there.
# macOS artifacts can only be built on a macOS host — hence the matrix.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The test harness drives cmd.exe-flavoured shells — Windows job only.
      - if: runner.os == 'Windows'
        run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
