name: Release

# Tag a version to ship it:
#   npm version patch   (bumps package.json + creates the vX.Y.Z tag)
#   git push origin main --tags
# electron-builder uploads the installers + latest.yml to a GitHub Release;
# electron-updater in the packaged app picks updates up from there.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
